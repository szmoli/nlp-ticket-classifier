<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ticket List</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    a.button {
      text-decoration: none;
      padding: 4px 8px;
      border: 1px solid #333;
      border-radius: 4px;
      margin-right: 4px;
    }
    form {
      display: inline;
    }
    button {
      padding: 4px 8px;
      border: 1px solid #c00;
      background-color: #fdd;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #fbb;
    }
  </style>
</head>
<body>
  <h1>All Tickets</h1>

  <p><a class="button" href="{{ url_for('new_ticket') }}">Create New Ticket</a></p>

  {% if tickets %}
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Team</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for t in tickets %}
          <tr>
            {% if t['subject'] %}
              <td><a href="{{ url_for('view_ticket', ticket_id=t['id']) }}">{{ t['subject'] }}</a></td>
            {% else %}
              <td><a href="{{ url_for('view_ticket', ticket_id=t['id']) }}">No subject</a></td>
            {% endif %}
            <td>{{ t['team'] }}</td>
            <td>
              <a class="button" href="{{ url_for('edit_ticket', ticket_id=t['id']) }}">Edit</a>
              <form method="POST" action="{{ url_for('delete_ticket', ticket_id=t['id']) }}">
                <button type="submit" onclick="return confirm('Delete this ticket?');">Delete</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No tickets yet!</p>
  {% endif %}
</body>
</html>
