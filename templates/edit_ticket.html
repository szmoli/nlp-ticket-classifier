<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Ticket</title>
</head>
<body>
  <h1>Edit Ticket</h1>

  <form method="POST">
    <label>Subject:</label><br>
    <input type="text" name="subject" value="{{ ticket['subject'] }}" required><br><br>

    <label>Body:</label><br>
    <textarea name="body" rows="5" cols="40" required>{{ ticket['body'] }}</textarea><br><br>

    <label>Team:</label><br>
    <input type="text" name="team" value="{{ ticket['team'] }}" required><br><br>

    <button type="submit">Save Changes</button>
  </form>

  <p><a href="{{ url_for('index') }}">Back to list</a></p>
</body>
</html>
